# This file contains definitions of CI job parameters that are loaded
# dynamically in CI from ci.yml.
runners:
  - &base-job
    env: { }

  - &job-linux-4c
    os: ubuntu-24.04
    # Free some disk space to avoid running out of space during the build.
    free_disk: true
    <<: *base-job

  - &job-linux-4c-largedisk
    os: ubuntu-24.04-4core-16gb
    <<: *base-job

  - &job-linux-8c
    os: ubuntu-24.04-8core-32gb
    <<: *base-job

  - &job-linux-16c
    os: ubuntu-24.04-16core-64gb
    <<: *base-job

  - &job-macos
    os: macos-15 # macOS 15 Arm64
    <<: *base-job

  - &job-windows
    os: windows-2025
    <<: *base-job

  - &job-windows-8c
    os: windows-2025-8core-32gb
    <<: *base-job

  - &job-windows-aarch64
    os: windows-11-arm
    <<: *base-job

  - &job-aarch64-linux
    # Free some disk space to avoid running out of space during the build.
    free_disk: true
    os: ubuntu-24.04-arm
    <<: *base-job

  - &job-aarch64-linux-8c
    os: ubuntu-24.04-arm64-8core-32gb
    <<: *base-job

  # Codebuild runners are provisioned in
  # https://github.com/rust-lang/simpleinfra/blob/b7ddd5e6bec8a93ec30510cdddec02c5666fefe9/terragrunt/accounts/ci-prod/ci-runners/terragrunt.hcl#L2
  - &job-linux-36c-codebuild
    free_disk: true
    codebuild: true
    os: codebuild-ubuntu-22-36c-$github.run_id-$github.run_attempt
    <<: *base-job

  - &job-linux-8c-codebuild
    free_disk: true
    codebuild: true
    os: codebuild-ubuntu-22-8c-$github.run_id-$github.run_attempt
    <<: *base-job

envs:
  production:
    &production
    DEPLOY_BUCKET: rust-lang-ci2
    CACHES_AWS_ACCESS_KEY_ID: AKIA46X5W6CZI5DHEBFL
    ARTIFACTS_AWS_ACCESS_KEY_ID: AKIA46X5W6CZN24CBO55
    AWS_REGION: us-west-1
    TOOLSTATE_PUBLISH: 1

  try:
    <<: *production

  auto:
    <<: *production

  pr:
    PR_CI_JOB: 1

jobs:
  dist-x86_64-linux: &job-dist-x86_64-linux
    name: dist-x86_64-linux
    env:
      IMAGE: dist-x86_64-linux
      CODEGEN_BACKENDS: llvm,cranelift
      DOCKER_SCRIPT: dist.sh
    <<: *job-linux-36c-codebuild

# Only run x86_64-gnu-aux for benchmarking
pr:
  - name: x86_64-gnu-aux
    <<: *job-linux-4c

try:
  - <<: *job-dist-x86_64-linux
    name: dist-x86_64-linux-quick

optional:
  - name: optional-pr-check-1
    env:
      IMAGE: pr-check-1
    <<: *job-linux-4c

auto:
  - name: x86_64-gnu-aux
    <<: *job-linux-4c
